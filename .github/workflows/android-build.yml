name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Build web assets
      run: npm run build

    - name: Setup JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Accept Android SDK licenses and install packages
      run: |
        echo "ANDROID_HOME=$ANDROID_HOME"
        yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

    - name: Copy web assets to Android project
      run: |
        mkdir -p android/app/src/main/assets/public
        rm -rf android/app/src/main/assets/public/*
        cp -r dist/* android/app/src/main/assets/public/
        ls -la android/app/src/main/assets/public/

    - name: Build Debug APK
      working-directory: ./android
      run: |
        set -o pipefail
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle-build.log

    - name: Verify APK
      working-directory: ./android
      run: ls -la app/build/outputs/apk/debug/

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: parkit-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
        retention-days: 30
