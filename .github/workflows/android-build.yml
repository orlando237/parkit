name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm ci

    - name: Build web assets
      run: npm run build

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Debug Gradle build
      working-directory: ./android
      run: |
        chmod +x gradlew
        echo "Current directory:"
        pwd
        echo "Java version:"
        $JAVA_HOME/bin/java -version
        echo "Gradle wrapper exists:"
        ls -la gradlew
        echo "Building APK..."
        ./gradlew assembleDebug --stacktrace --info 2>&1 | tail -50

    - name: Upload APK
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: parkit-debug-apk
        path: ./android/app/build/outputs/apk/debug/*.apk
        retention-days: 7