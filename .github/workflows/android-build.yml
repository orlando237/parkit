name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Build web assets
      env:
        VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://khmjxoxewqfkyyxfnjba.supabase.co' }}
        VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_4cevbr82hFPJ2JFvoyJEAw_zsvd8prv' }}
      run: npm run build

    - name: Setup JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Sync Capacitor Android
      run: npx cap copy android

    - name: Build APK
      working-directory: ./android
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon
        cp app/build/outputs/apk/debug/app-debug.apk ../PARKIT.apk

    - name: Upload APK Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: parkit-debug-apk
        path: ./PARKIT.apk
        retention-days: 30

    - name: Publish Direct APK Release
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        tag_name: apk-latest
        name: PARKIT Android APK (Última versión)
        files: ./PARKIT.apk
        make_latest: true
