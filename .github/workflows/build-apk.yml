name: Build Android Release APK

on:
  push:
    branches: [ main, master, release, build ]
  pull_request:
    branches: [ main, master, release, build ]
  workflow_dispatch:
    inputs:
      variant:
        description: 'Build variant'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest
    
    env:
      JAVA_OPTS: '-Xmx2g -Xms512m'
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        architecture: 'x64'
        cache: gradle

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: ./parkit-app/package-lock.json

    - name: Install npm dependencies
      working-directory: ./parkit-app
      run: npm ci

    - name: Build web app
      working-directory: ./parkit-app
      run: npm run build

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: 34
        build-tools: 34.0.0
        ndk: ''
        cmake: ''

    - name: Copy web assets
      working-directory: ./parkit-app
      run: npx cap copy android

    - name: Grant execute permission to gradlew
      working-directory: ./parkit-app/android
      run: chmod +x gradlew

    - name: Build Debug APK
      if: inputs.variant == 'debug' || github.event_name == 'pull_request'
      working-directory: ./parkit-app/android
      run: ./gradlew assembleDebug --no-daemon

    - name: Build Release APK (unsigned)
      if: inputs.variant == 'release'
      working-directory: ./parkit-app/android
      run: ./gradlew assembleRelease --no-daemon

    - name: Upload Debug APK
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: parkit-debug-apk
        path: ./parkit-app/android/app/build/outputs/apk/debug/*.apk
        retention-days: 30
      with:
        name: parkit-release-apk
        path: ./parkit-app/android/app/build/outputs/apk/release/*.apk
        retention-days: 30